# cloudflared/config.yml
# ─────────────────────────────────────────────────────────────────────────────
# Cloudflare Tunnel configuration for Spoticord
# Generated by CLOUDFLARE_SETUP.md – fill in tunnel-id and your domain
# ─────────────────────────────────────────────────────────────────────────────

tunnel: YOUR_TUNNEL_ID_HERE
credentials-file: /home/YOUR_USERNAME/.cloudflared/YOUR_TUNNEL_ID_HERE.json

ingress:
  # Spotify OAuth callback → local oauth-server container
  - hostname: spoticord.yourdomain.com
    service: http://localhost:8888

  # Catch-all (required by cloudflared)
  - service: http_status:404
